<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1075" width="1400" height="1075" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#1f2328">
<title>ECE260B step 1 single-core Q x K^T accelerator architecture</title>
<desc>Block diagram of the single-core 8-input MAC K-stationary systolic accelerator: q_mem and k_mem SRAMs feed a 2:1 mux into an 8-column mac_array, column outputs go through an 8-lane ofifo into pmem, and pmem drives the new top-level output port. Includes inst decode table, TB phase sequence, and change list versus the course template.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ba7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="1075" fill="#ffffff"/>

<text x="100" y="30" font-size="16" font-weight="600">ECE260B step 1 - single-core Q x K^T accelerator (8-input MAC, K-stationary systolic array)</text>
<text x="100" y="48" fill="#57606a">Template backbone (ece260_project) with rebuild changes marked CHANGED / NEW.  Params: bw=8, pr=8 (was 16), col=8, bw_psum=20 (19 needed), total_cycle=8.</text>
<text x="100" y="64" fill="#57606a">Widths: element 8b, vector = pr*bw = 64b, psum = 20b, row = col*bw_psum = 160b.  Single clock domain (clk, reset to all blocks).  Ports: inputs west, outputs south (PnR spec).</text>

